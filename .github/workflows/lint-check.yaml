name: Lint check

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: nightly
          components: rustfmt

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3

      - run: pnpm i
      - run: pnpm format:check

  clippy-fix-check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17
        with:
          toolchain: nightly
          components: clippy
          targets: x86_64-pc-windows-gnu x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm i
      - name: Check for autofixable clippy warnings
        shell: bash
        run: |
          pnpm lint:fix
          if git status --porcelain | grep -q .; then
            echo "::error::Detected autofixable clippy warnings. Please run 'pnpm lint:fix' locally, commit, and push."
            git diff --stat
            exit 1
          fi

      - name: Check for autofixable clippy warnings (windows cross target)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          pnpm lint:fix:windows
          if git status --porcelain | grep -q .; then
            echo "::error::Detected autofixable clippy warnings (windows target). Please run 'pnpm lint:fix:windows' locally, commit, and push."
            git diff --stat
            exit 1
          fi
